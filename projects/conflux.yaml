version: 1
id: conflux
name: Conflux
path: .
description: 本地优先、证据可追溯的研究工作台。
enabled: true
documents:
  directories:
  - docs
  root_files:
  - README.md
  - PRODUCT.md
  - DESIGN.md
artifacts:
  result_dirs:
  - results
  - artifacts
  - experiments
  report_dirs:
  - reports
test:
  command: python -m pytest -q
  timeout_seconds: 600
plan:
  overall_goal: 把论文发现、知识沉淀、证据问答和项目进度审计连接成可持续使用的本地研究工作台。
  milestones:
  - id: m0-baseline
    title: M0 基线与实施准备
    status: completed
    description: 固定离线测试、检索和报告评测基线，建立架构夹具和问题登记约定。
    deliverables:
    - docs/reports/m0_baseline_report.md
    - tests/fixtures/architecture/
  - id: m1-extension-protocol
    title: M1 扩展协议最小闭环
    status: completed
    description: 建立 SDK、Manifest、Registry、权限校验、统一 StepResult 和 YAML 工作流协议。
    deliverables:
    - src/conflux/sdk/
    - src/conflux/core/
    - src/conflux/adapters/plugin_loader.py
  - id: m2-first-party-capabilities
    title: M2 第一方能力与 YAML 工作流
    status: completed
    description: 通过统一协议接入文本、RAG、Web、研究和论文能力，并保留 LLM 语义评审状态。
    deliverables:
    - src/conflux/builtin/
    - tests/fixtures/architecture/workflows/
    - M2 集成测试
  - id: p2-project-paper-radar
    title: P2 项目驱动论文雷达
    status: in_progress
    description: 已完成项目绑定、Track 搜索扩面、项目论文关联和 Workbench Research 视图的文件模式闭环，待 M3 统一持久化。
    deliverables:
    - ProjectResearchConfig 与 SearchIntent 等类型化契约（19 个 Pydantic 类型）
    - 项目级论文状态和报告目录（reports/workbench/projects/{id}/papers/）
    - Workbench 项目 Research 视图（标签页 + 端点 + JS）
    - P2 人工标注集和验收报告（tests/test_p2_paper_radar.py，25 tests）
  - id: m3-persistent-runs
    title: M3 持久运行与初始化迁移
    status: planned
    description: 在 P2 文件模式闭环验证后，引入 SQLite Run Store，并迁移论文身份、项目关联、搜索意图、事件和审批状态。
    deliverables: []
  next_actions:
  - 定义 ProjectResearchConfig、ProjectResearchContext、SearchIntent、ProjectPaperLink 和 ProjectImpactSuggestion 契约。
  - 让论文 inbox 接受 project_id，并按项目隔离画像、输出、缓存和已见状态。
  - 为研究画像增加兼容的 Track/QuerySpec，优先扩大 arXiv 与 Semantic Scholar 搜索面。
  - 在项目页增加 Research 视图，并以审批方式处理项目行动和知识入库建议。
  source_documents:
  - docs/plans/execution_plan_v1.md
  - docs/architecture.md
  - docs/reports/m0_baseline_report.md
  - PRODUCT.md
  updated_at: '2026-07-20'
refresh:
  mode: manual
  schedule_enabled: false
  interval_minutes: null
  timezone: Asia/Shanghai
  last_refreshed_at: ''
  next_refresh_at: ''
metadata:
  owner: local
research:
  profile: profiles/example_gis_agent.yaml
  sources:
  - arxiv
  - semantic_scholar
  cadence: manual
  max_candidates: 100
  deep_read_limit: 5
  auto_generate_queries: true
  require_query_review: true
  require_plan_writeback_approval: true
