version: 1
id: conflux
name: Conflux
path: .
description: 本地优先、证据可追溯的研究工作台。
enabled: true
documents:
  directories:
  - docs
  root_files:
  - README.md
  - PRODUCT.md
  - DESIGN.md
artifacts:
  result_dirs:
  - results
  - artifacts
  - experiments
  report_dirs:
  - reports
test:
  command: python -m pytest -q
  timeout_seconds: 600
plan:
  overall_goal: 把论文发现、知识沉淀、证据问答和项目进度审计连接成可持续使用的本地研究工作台。
  milestones:
  - id: m0-baseline
    title: M0 基线与实施准备
    status: completed
    description: 固定离线测试、检索和报告评测基线，建立架构夹具和问题登记约定。
    deliverables:
    - docs/reports/m0_baseline_report.md
    - tests/fixtures/architecture/
  - id: m1-extension-protocol
    title: M1 扩展协议最小闭环
    status: completed
    description: 建立 SDK、Manifest、Registry、权限校验、统一 StepResult 和 YAML 工作流协议。
    deliverables:
    - src/conflux/sdk/
    - src/conflux/core/
    - src/conflux/adapters/plugin_loader.py
  - id: m2-first-party-capabilities
    title: M2 第一方能力与 YAML 工作流
    status: completed
    description: 通过统一协议接入文本、RAG、Web、研究和论文能力，并保留 LLM 语义评审状态。
    deliverables:
    - src/conflux/builtin/
    - tests/fixtures/architecture/workflows/
    - M2 集成测试
  - id: p2-project-paper-radar
    title: P2 项目驱动论文雷达
    status: completed
    description: 已完成项目绑定、Track 搜索扩面、项目论文关联、两领域终审评测和 Workbench Research 视图，并由 M3 迁入 SQLite 权威状态。
    deliverables:
    - ProjectResearchConfig 与 SearchIntent 等类型化契约（19 个 Pydantic 类型）
    - 项目级论文状态和报告目录（reports/workbench/projects/{id}/papers/）
    - Workbench 项目 Research 视图（标签页 + 端点 + JS）
    - P2 人工标注集和验收报告（tests/test_p2_paper_radar.py，25 tests）
  - id: phase2-usability
    title: 阶段 2 真实使用与阻断修复
    status: completed
    description: 已完成知识库模型切换、研究查询交付状态、项目监控数据口径和真实使用阻断修复。
    deliverables:
    - 可保留旧向量的知识库完整重建流程
    - 研究查询完整性与引用核验分离
    - 基于当前计划和实际成果的项目监控
  - id: m3-persistent-runs
    title: M3 持久运行与初始化迁移
    status: completed
    description: SQLite 已成为 Run、Job、Event、Checkpoint、论文身份、项目关联和搜索状态权威来源。
    deliverables:
    - SQLite Repository 与 Legacy 导入
    - 论文雷达周期 Job 和通用查询持久 Job
    - SSE EventStore、Checkpoint 恢复和 RunContext 配置隔离
  - id: m4-evidence-ledger
    title: M4 Evidence Ledger 与验证闭环
    status: completed
    description: 已完成跨运行来源版本、声明关系、产物影响分析和 Workbench 待确认复核闭环。
    deliverables:
    - SQLite migration 0005_evidence_ledger
    - EvidenceLedgerRepository 与持久查询自动落库
    - 外部进程中断恢复验证和 Workbench 证据变化复核
  - id: m5-evaluation-extensions
    title: M5 LLM 评审评测与示例扩展
    status: completed
    description: 已完成四策略评测、当前 V2/V3 路径 R3 replay 和两个互补 SDK 示例；asp-2/asp-6 live 结果保留为不稳定。
    deliverables:
    - evaluation/m5/manifest.json
    - reports/evaluation/m5/m5_evaluation.json
    - example.local-jsonl-source 与 example.evidence-coverage-evaluator
  next_actions:
  - 继续观察 RAG Gold asp-2/asp-6 的跨运行稳定性，不把 1/3 live 覆盖升级为能力通过。
  - 仅在多工作区并发、SQLite 瓶颈、远程 Worker/备份或强隔离需求出现时评估 M6。
  source_documents:
  - docs/plans/执行计划v1.md
  - docs/架构设计.md
  - docs/plans/done/项目总体进展报告.md
  - PRODUCT.md
  updated_at: '2026-08-09'
refresh:
  mode: manual
  schedule_enabled: false
  interval_minutes: null
  timezone: Asia/Shanghai
  last_refreshed_at: ''
  next_refresh_at: ''
metadata:
  owner: local
research:
  profile: profiles/example_gis_agent.yaml
  sources:
  - arxiv
  - semantic_scholar
  cadence: manual
  max_candidates: 100
  deep_read_limit: 5
  semantic_review_limit: 40
  auto_generate_queries: true
  require_query_review: true
  require_plan_writeback_approval: true
