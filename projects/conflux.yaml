version: 1
id: conflux
name: Conflux
path: .
description: 本地优先、证据可追溯的研究工作台。
enabled: true
documents:
  directories:
  - docs
  root_files:
  - README.md
  - PRODUCT.md
  - DESIGN.md
artifacts:
  result_dirs:
  - results
  - artifacts
  - experiments
  report_dirs:
  - reports
test:
  command: python -m pytest -q
  timeout_seconds: 600
plan:
  overall_goal: 把论文发现、知识沉淀、证据问答和项目进度审计连接成可持续使用的本地研究工作台。
  milestones:
  - id: m0-baseline
    title: M0 基线与实施准备
    status: completed
    description: 固定离线测试、检索和报告评测基线，建立架构夹具和问题登记约定。
    deliverables:
    - docs/reports/m0_baseline_report.md
    - tests/fixtures/architecture/
  - id: m1-extension-protocol
    title: M1 扩展协议最小闭环
    status: completed
    description: 建立 SDK、Manifest、Registry、权限校验、统一 StepResult 和 YAML 工作流协议。
    deliverables:
    - src/conflux/sdk/
    - src/conflux/core/
    - src/conflux/adapters/plugin_loader.py
  - id: m2-first-party-capabilities
    title: M2 第一方能力与 YAML 工作流
    status: completed
    description: 通过统一协议接入文本、RAG、Web、研究和论文能力，并保留 LLM 语义评审状态。
    deliverables:
    - src/conflux/builtin/
    - tests/fixtures/architecture/workflows/
    - M2 集成测试
  - id: m3-persistent-runs
    title: M3 持久运行与初始化迁移
    status: planned
    description: 在确认存储迁移边界后引入 SQLite Run Store、事件和审批持久化。
    deliverables: []
  next_actions:
  - 用离线夹具和真实 API 各复测 M0-M2，记录质量、延迟、成本和失败降级。
  - 修复画像优化、项目文档发现和研究查询超时等已知体验问题。
  - 在 M3 启动前单独确认 SQLite Run Store、初始化和迁移方案。
  source_documents:
  - docs/plans/execution_plan_v1.md
  - docs/architecture.md
  - docs/reports/m0_baseline_report.md
  - PRODUCT.md
  updated_at: '2026-07-18'
refresh:
  mode: manual
  schedule_enabled: false
  interval_minutes: null
  timezone: Asia/Shanghai
  last_refreshed_at: ''
  next_refresh_at: ''
metadata:
  owner: local
