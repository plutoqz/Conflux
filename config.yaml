# Conflux 配置文件
# 所有值均可通过环境变量 CONFLUX_<SECTION>__<KEY> 覆盖，例如：
#   CONFLUX_MODELS__REASONING__API_KEY
# api_key 不应写入仓库；留空时由模型工厂读取对应环境变量。

models:
  # These presets are deployment configuration, not backend model choices.
  # Users may replace every provider/model mapping while keeping the role names.
  # The values below are the current non-Gemini development-test setup.
  flash:
    provider: openai_compatible
    model: qwen3.7-plus
    base_url: https://www.dmxapi.cn/v1
    api_key:
    temperature: 0.2
    max_tokens: 4096
    timeout: 60
    max_retries: 1
    extra_body:
      enable_thinking: false

  balanced:
    provider: openai_compatible
    model: qwen3.7-plus
    base_url: https://www.dmxapi.cn/v1
    api_key:
    temperature: 0.25
    max_tokens: 8192
    timeout: 90
    max_retries: 1
    extra_body:
      enable_thinking: false

  reasoning:
    provider: openai_compatible
    model: deepseek-v4-pro
    base_url: https://www.dmxapi.cn/v1
    api_key:
    temperature: 0.25
    max_tokens: 12288
    timeout: 120
    max_retries: 1

  verifier:
    provider: openai_compatible
    model: MiniMax-M3
    base_url: https://www.dmxapi.cn/v1
    api_key:
    temperature: 0.0
    max_tokens: 8192
    timeout: 90
    max_retries: 1
    extra_body:
      enable_thinking: false

  # Legacy alias retained for existing integrations. P1 roles use the
  # explicit flash/balanced/reasoning/verifier presets below.
  cheap:
    provider: openai_compatible
    model: qwen3.7-plus
    base_url: https://www.dmxapi.cn/v1
    api_key:
    temperature: 0.0
    max_tokens: 1024
    timeout: 60
    max_retries: 1
    extra_body:
      enable_thinking: false

embedding:
  provider: openai_compatible
  model: text-embedding-3-small
  base_url: https://www.dmxapi.cn/v1
  api_key:

web_search:
  provider: duckduckgo
  max_results: 5
  max_subqueries: 6
  max_parallel_queries: 3
  fetch_content: true
  max_fetched_results: 5
  max_fetch_attempts: 8
  fetch_timeout_seconds: 12
  max_fetch_bytes: 5242880
  max_pdf_pages: 30
  # Providers are attempted in order when the current source fails or yields
  # too few relevant URLs. Bing/Google require their authorized API keys.
  fallback_providers: [duckduckgo, bing, google, serpapi]

vector_store:
  provider: chromadb
  persist_dir: ./data/chroma_db
  collection_name: conflux_docs

retrieval:
  top_k: 10
  final_k: 5
  parent_chunk_size: 1024
  child_chunk_size: 256
  bm25_weight: 0.3
  dense_weight: 0.7

agent:
  max_iterations: 3
  confidence_threshold: 0.7

research:
  # Set to p1 to roll back to the previously accepted three-source pipeline.
  pipeline: p15
  depth: standard
  enable_l4: true
  max_deep_questions: 2
  max_verify_iterations: 1
  max_rewrite_attempts: 2
  generalization:
    enabled: true
    min_external_evidence_per_dimension: 1
    authority_threshold: 0.75
    coverage_target: 0.8
    quick:
      narrow_dimension_target: 2
      broad_dimension_target: 4
      max_dimensions: 5
      max_breadth_queries: 10
      max_depth_queries: 4
      max_final_evidence: 8
      max_web_fetches: 4
      max_web_fetch_attempts: 6
      max_coverage_iterations: 0
      max_report_chars: 3500
    standard:
      narrow_dimension_target: 4
      broad_dimension_target: 7
      max_dimensions: 9
      max_breadth_queries: 20
      max_depth_queries: 14
      max_final_evidence: 20
      max_web_fetches: 7
      max_web_fetch_attempts: 14
      max_coverage_iterations: 1
      max_report_chars: 8000
    deep:
      narrow_dimension_target: 5
      broad_dimension_target: 10
      max_dimensions: 15
      max_breadth_queries: 30
      max_depth_queries: 24
      max_final_evidence: 40
      max_web_fetches: 10
      max_web_fetch_attempts: 20
      max_coverage_iterations: 2
      max_report_chars: 16000
  profiles:
    quick:
      planner_model: flash
      analyst_model: flash
      reranker_model: balanced
      synthesizer_model: flash
      verifier_model: flash
      max_gap_iterations: 0
      max_subquestions: 4
      max_parallel_subquestions: 2
      candidate_limit: 6
      final_evidence_limit: 6
      web_max_results: 3
      web_max_subqueries: 3
      web_fetch_limit: 2
      web_fetch_attempts: 3
      max_query_rewrites: 0
      factcheck_strength: light
      planner_max_tokens: 4000
      analyst_max_tokens: 4000
      reranker_max_tokens: 600
      synthesizer_max_tokens: 5000
      verifier_max_tokens: 600
      token_budget: 55000
      model_timeout_seconds: 30
      max_retries: 0
      timeout_seconds: 180
    standard:
      planner_model: flash
      analyst_model: flash
      reranker_model: flash
      synthesizer_model: verifier
      verifier_model: balanced
      max_gap_iterations: 1
      max_subquestions: 4
      max_parallel_subquestions: 3
      candidate_limit: 8
      final_evidence_limit: 8
      web_max_results: 4
      web_max_subqueries: 4
      web_fetch_limit: 3
      web_fetch_attempts: 5
      max_query_rewrites: 1
      factcheck_strength: full
      planner_max_tokens: 4500
      analyst_max_tokens: 3200
      reranker_max_tokens: 1000
      synthesizer_max_tokens: 5500
      verifier_max_tokens: 1600
      token_budget: 75000
      model_timeout_seconds: 70
      max_retries: 0
      timeout_seconds: 240
    deep:
      planner_model: reasoning
      analyst_model: reasoning
      reranker_model: balanced
      synthesizer_model: reasoning
      verifier_model: balanced
      max_gap_iterations: 2
      max_subquestions: 6
      max_parallel_subquestions: 3
      candidate_limit: 12
      final_evidence_limit: 12
      web_max_results: 5
      web_max_subqueries: 6
      web_fetch_limit: 4
      web_fetch_attempts: 6
      max_query_rewrites: 2
      factcheck_strength: cross_check
      planner_max_tokens: 2400
      analyst_max_tokens: 3200
      reranker_max_tokens: 1200
      synthesizer_max_tokens: 6000
      verifier_max_tokens: 3200
      token_budget: 140000
      model_timeout_seconds: 120
      max_retries: 0
      timeout_seconds: 480

slo:
  survey_p95_ms: 45000
