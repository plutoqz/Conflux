models:
  flash:
    provider: openai_compatible
    model: deepseek-v4-flash-guan
    base_url: https://www.dmxapi.cn/v1
    api_key: null
    temperature: 0.2
    max_tokens: 4096
    timeout: 60
    max_retries: 1
    extra_body:
      enable_thinking: false
  balanced:
    provider: openai_compatible
    model: deepseek-v4-flash-guan
    base_url: https://www.dmxapi.cn/v1
    api_key: null
    temperature: 0.25
    max_tokens: 8192
    timeout: 90
    max_retries: 1
    extra_body:
      enable_thinking: false
  reasoning:
    provider: openai_compatible
    model: deepseek-v4-flash
    base_url: https://www.dmxapi.cn/v1
    api_key: null
    temperature: 0.25
    max_tokens: 12288
    timeout: 120
    max_retries: 1
  verifier:
    provider: openai_compatible
    model: deepseek-v4-flash-guan
    base_url: https://www.dmxapi.cn/v1
    api_key: null
    temperature: 0.0
    max_tokens: 8192
    timeout: 90
    max_retries: 1
    extra_body:
      enable_thinking: false
  cheap:
    provider: openai_compatible
    model: deepseek-v4-flash
    base_url: https://www.dmxapi.cn/v1
    api_key: null
    temperature: 0.0
    max_tokens: 1024
    timeout: 60
    max_retries: 1
    extra_body:
      enable_thinking: false
embedding:
  provider: openai_compatible
  model: text-embedding-v4
  base_url: https://www.dmxapi.cn/v1
  api_key: null
web_search:
  provider: duckduckgo
  max_results: 5
  max_subqueries: 6
  max_parallel_queries: 3
  fetch_content: true
  max_fetched_results: 5
  max_fetch_attempts: 8
  fetch_timeout_seconds: 12
  max_fetch_bytes: 5242880
  max_pdf_pages: 30
  fallback_providers:
  - duckduckgo
  - bing
  - google
  - serpapi
vector_store:
  provider: chromadb
  persist_dir: ./data/chroma_db
  collection_name: conflux_docs
retrieval:
  top_k: 60
  final_k: 10
  parent_chunk_size: 512
  child_chunk_size: 128
  bm25_weight: 0.3
  dense_weight: 0.7
agent:
  max_iterations: 3
research:
  pipeline: answer_first
  depth: standard
  # R1 检索消融结论：LLM judge rerank 全面负优化，默认关闭；保留显式开启能力。
  semantic_rerank: false
  enable_l4: true
  max_deep_questions: 2
  max_rewrite_attempts: 2
  # Legacy: P1/P1.5 only. V2 does not inject hardcoded seed URLs into search results.
  deterministic_seeds: false
  generalization:
    enabled: true
    min_external_evidence_per_dimension: 1
    authority_threshold: 0.75
    coverage_target: 0.8
    domain_relevance_threshold: 0.7
    claim_entailment_threshold: 0.7
    delivery_gate:
      enabled: true
      citation_coverage_threshold: 0.9
      limited_citation_coverage_threshold: 0.85
      high_importance_coverage_threshold: 0.85
      limited_high_importance_coverage_threshold: 0.6
    quick:
      narrow_dimension_target: 2
      broad_dimension_target: 4
      max_dimensions: 5
      max_breadth_queries: 10
      max_depth_queries: 4
      max_final_evidence: 8
      max_web_fetches: 4
      max_web_fetch_attempts: 6
      max_coverage_iterations: 0
      max_report_chars: 3500
    standard:
      narrow_dimension_target: 4
      broad_dimension_target: 7
      max_dimensions: 9
      max_breadth_queries: 20
      max_depth_queries: 14
      max_final_evidence: 20
      max_web_fetches: 7
      max_web_fetch_attempts: 14
      max_coverage_iterations: 1
      max_report_chars: 8000
    deep:
      narrow_dimension_target: 5
      broad_dimension_target: 10
      max_dimensions: 15
      max_breadth_queries: 30
      max_depth_queries: 24
      max_final_evidence: 40
      max_web_fetches: 10
      max_web_fetch_attempts: 20
      max_coverage_iterations: 2
      max_report_chars: 16000
  profiles:
    quick:
      planner_model: flash
      analyst_model: flash
      reranker_model: balanced
      synthesizer_model: flash
      verifier_model: flash
      max_gap_iterations: 0
      max_subquestions: 4
      max_parallel_subquestions: 2
      candidate_limit: 6
      final_evidence_limit: 6
      web_max_results: 3
      web_max_subqueries: 3
      web_fetch_limit: 2
      web_fetch_attempts: 3
      max_query_rewrites: 0
      factcheck_strength: light
      planner_max_tokens: 4000
      analyst_max_tokens: 4000
      reranker_max_tokens: 600
      synthesizer_max_tokens: 5000
      verifier_max_tokens: 600
      token_budget: 55000
      model_timeout_seconds: 30
      max_retries: 0
      timeout_seconds: 180
    standard:
      planner_model: flash
      analyst_model: flash
      reranker_model: flash
      synthesizer_model: verifier
      verifier_model: balanced
      max_gap_iterations: 1
      max_subquestions: 4
      max_parallel_subquestions: 3
      candidate_limit: 8
      final_evidence_limit: 8
      web_max_results: 4
      web_max_subqueries: 4
      web_fetch_limit: 3
      web_fetch_attempts: 5
      max_query_rewrites: 1
      factcheck_strength: full
      planner_max_tokens: 4500
      analyst_max_tokens: 3200
      reranker_max_tokens: 1000
      synthesizer_max_tokens: 5500
      verifier_max_tokens: 1600
      token_budget: 75000
      model_timeout_seconds: 120
      max_retries: 0
      timeout_seconds: 240
    deep:
      planner_model: reasoning
      analyst_model: reasoning
      reranker_model: balanced
      synthesizer_model: reasoning
      verifier_model: balanced
      max_gap_iterations: 2
      max_subquestions: 6
      max_parallel_subquestions: 3
      candidate_limit: 12
      final_evidence_limit: 12
      web_max_results: 5
      web_max_subqueries: 6
      web_fetch_limit: 4
      web_fetch_attempts: 6
      max_query_rewrites: 2
      factcheck_strength: cross_check
      planner_max_tokens: 2400
      analyst_max_tokens: 3200
      reranker_max_tokens: 1200
      synthesizer_max_tokens: 6000
      verifier_max_tokens: 3200
      token_budget: 320000
      model_timeout_seconds: 240
      max_retries: 0
      timeout_seconds: 480
slo:
  survey_p95_ms: 45000
