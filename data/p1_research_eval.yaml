# P1 三源研究质量评测集。preferred_sources 表示优先来源，不是强制投票条件。

- id: p1_geo_deep_001
  category: model_synthesis
  query: "当前地理处理自动化研究存在哪些局限性？"
  preferred_sources: [Model, RAG, Web]
  required_dimensions: [数据, 算法与方法, 系统工程, 评估与基准, 治理与伦理, 应用边界]
  temporal_sensitivity: medium
  risk: medium
  reference_report: tests/fixtures/architecture/p1_reference_report.md
  require_all_dimensions: true
  minimum_external_evidence: 8
  minimum_independent_sources: 5

