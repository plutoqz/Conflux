# P1.5 generalized deep-research evaluation set.
# The cases form a covering set, not a full Cartesian product. Real API runs
# may select a stratified subset; offline validation must cover every row.

- id: p15_materials_method_broad
  domain: materials_science
  query: "What methods are used to recycle lithium-ion batteries, and where does each method fit?"
  archetype: method_survey
  breadth: broad
  temporality: stable
  rag_coverage: covered
  source_scenario: rag_success_web_success
  requires_recommendation: false
  expected_research_actions: [taxonomy_discovery, mechanism_analysis, representative_implementations, applicability, limitations, maturity, combination_relations]
  expected_dimensions: [mechanical_pretreatment, pyrometallurgy, hydrometallurgy, direct_recycling, safety, economics_and_environment]

- id: p15_software_method_narrow
